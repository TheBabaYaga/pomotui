name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain input is required. This action has no default.
      # clippy is not on the runner image, so ask for it here.
      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # cargo fmt rejects --locked, so this one command goes without it.
      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  msrv:
    name: Build on the minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Quote the version. Bare 1.88 is a YAML float.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # This proves the rust-version in Cargo.toml is still true.
      - name: Check
        run: cargo check --locked --all-targets
