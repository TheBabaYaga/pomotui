[package]
name = "pomotui"
version = "0.1.0"
edition = "2024"
# The measured floor, not the toolchain in use. ratatui 0.30 declares 1.88.0,
# and the let-chain in main.rs needs 1.88. Edition 2024 alone needs only 1.85.
rust-version = "1.88"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
